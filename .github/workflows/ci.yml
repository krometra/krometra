name: CI

on:
  push:
    branches: [master, "change/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  api-types:
    # Типы фронта генерируются из OpenAPI-схемы FastAPI и не правятся руками
    # (ROADMAP, P2 п.6). Джоба валится, если сгенерированный файл разошёлся
    # со схемой backend — значит забыли `npm run gen:api`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Export OpenAPI schema
        working-directory: backend
        env:
          DEBUG: "true"
        run: python -m scripts.export_openapi_schema > "$RUNNER_TEMP/openapi.json"
      - working-directory: web
        run: npm ci
      - name: Generated API types must match backend schema
        working-directory: web
        env:
          OPENAPI_SCHEMA: ${{ runner.temp }}/openapi.json
        run: npm run gen:api:check

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cadstudio
          POSTGRES_PASSWORD: cadstudio
          POSTGRES_DB: krometra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql+asyncpg://cadstudio:cadstudio@localhost:5432/krometra_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v

  viewport-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure integration stack
        working-directory: .
        run: |
          cp .env.example .env
          sed -i \
            -e 's/@localhost:5432/@postgres:5432/' \
            -e 's|redis://localhost:6379|redis://redis:6379|' \
            -e 's/MINIO_ENDPOINT=localhost:9000/MINIO_ENDPOINT=minio:9000/' \
            .env
      - name: Start backend services
        working-directory: .
        run: docker compose --env-file .env -f .github/compose.e2e.yml -p cad-e2e up -d --build app
      - name: Wait for API and apply migrations
        working-directory: .
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/api/health > /dev/null; then
              docker compose --env-file .env -f .github/compose.e2e.yml -p cad-e2e exec -T app alembic upgrade head
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env -f .github/compose.e2e.yml -p cad-e2e logs app postgres minio
          exit 1
      - name: Start Vite and wait for API proxy
        run: |
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5173/api/health | grep -Eq '"app":"(CAD Studio|Крометра)"'; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/vite.log"
          exit 1
      - name: Viewport regression
        run: >-
          npx playwright test
          e2e/soap-dish.spec.ts
          e2e/soap-dish-per-edge.spec.ts
          e2e/multi-contour.spec.ts
          e2e/browser-reopen.spec.ts
          e2e/sketch-toolbar-width.spec.ts
          e2e/extrude-extent.spec.ts
          e2e/undo.spec.ts
          --project=chromium --workers=2
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-e2e-traces
          path: web/test-results/
          if-no-files-found: ignore
      - name: Show service logs on failure
        if: failure()
        working-directory: .
        run: docker compose --env-file .env -f .github/compose.e2e.yml -p cad-e2e logs --no-color app postgres redis minio

