version: "3.3"

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-ru}
        VITE_OPERATOR_NAME: ${VITE_OPERATOR_NAME:-}
        VITE_OPERATOR_EMAIL: ${VITE_OPERATOR_EMAIL:-}
    container_name: cad-studio-web
    ports:
      - "127.0.0.1:${WEB_PORT:-80}:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: cad-studio-app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
    depends_on:
      - postgres
      - redis
      - minio
      - mailpit
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


  mcp:
    build:
      context: ./web/mcp
      dockerfile: Dockerfile
    container_name: cad-studio-mcp
    ports:
      - "127.0.0.1:${MCP_PORT:-8787}:8787"
    environment:
      BACKEND_URL: http://app:8000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cad-studio-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: cadstudio
      POSTGRES_PASSWORD: cadstudio
      POSTGRES_DB: cadstudio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadstudio"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: cad-studio-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cad-studio-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # S3-хранилище для разработки: SeaweedFS с S3-шлюзом. Имя сервиса оставлено
  # minio, чтобы не менять MINIO_ENDPOINT в .env.
  minio:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: cad-studio-minio
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    environment:
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"app","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    volumes:
      - s3_data:/data

volumes:
  postgres_data:
  redis_data:
  s3_data:
