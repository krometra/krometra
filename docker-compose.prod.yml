name: cad-studio

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-ru}
    container_name: cad-studio-web
    ports:
      # Порт задаётся в .env: на проде это 80 под доменное имя.
      - "${WEB_PORT:-5000}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
      # Конфиги https появляются после выпуска сертификата (scripts/enable-https.sh)
      - ./deploy/nginx/ssl-vhost:/etc/nginx/ssl-vhost:ro
      - ./deploy/nginx/redirect:/etc/nginx/redirect:ro
    depends_on:
      - app
    restart: unless-stopped

  # Продление сертификата: раз в 12 часов пробует renew, свежий забирает nginx
  # по своему reload (см. таймер cad-studio-cert-reload на хосте).
  certbot:
    image: certbot/certbot:v5.8.0
    container_name: cad-studio-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cad-studio-app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped


  mcp:
    build:
      context: ./web/mcp
      dockerfile: Dockerfile
    container_name: cad-studio-mcp
    environment:
      BACKEND_URL: http://app:8000
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL не задан в .env (например https://krometra.ru)}
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cad-studio-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: cadstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      POSTGRES_DB: cadstudio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadstudio"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cad-studio-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cad-studio-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY не задан в .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY не задан в .env}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_certs:
  certbot_webroot:
