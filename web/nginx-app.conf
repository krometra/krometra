root /usr/share/nginx/html;
index index.html;
charset utf-8;
client_max_body_size 64k;

include /etc/nginx/snippets/security-headers.conf;
include /etc/nginx/snippets/assets.conf;

location / {
    try_files $uri $uri/ /index.html;
}

location ~ ^/api/auth/(token|register)$ {
    limit_req zone=auth burst=10 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
    limit_req zone=api burst=120 nodelay;
    client_max_body_size 60m;
    include /etc/nginx/snippets/proxy.conf;
}

# Удалённый MCP-сервер (сервис mcp): HTTP-транспорт MCP, WebSocket вкладок
# редактора, ссылки на экспорт и загрузку STEP. Имя резолвится при запросе,
# чтобы nginx стартовал и без сервиса mcp.
location /mcp {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mcp_upstream http://mcp:8787;
    client_max_body_size 60m;
    proxy_pass $mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
