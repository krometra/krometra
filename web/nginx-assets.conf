gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
gzip_static on;

# Vite кладёт хеш содержимого в имя каждого файла assets/, включая WASM ядра
# на 23 МБ: такой файл можно кэшировать навсегда, новая сборка даст новое имя.
# add_header в location отменяет унаследованные, поэтому заголовки повторяются.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# Главная - пререндеренный лендинг (scripts/prerender-landing.mjs): поисковик
# получает весь текст без JavaScript. Вошедший пользователь (подсказка
# kr_signed_in от фронтенда) сразу попадает в свои проекты.
location = / {
    absolute_redirect off;
    if ($cookie_kr_signed_in = "1") {
        return 302 /projects;
    }
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files /landing.html =404;
}

location = /landing.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex" always;
    include /etc/nginx/snippets/security-headers.conf;
}
