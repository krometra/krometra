server_tokens off;

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

map $scheme $hsts {
    https "max-age=31536000; includeSubDomains";
    default "";
}

# Embind ядра собирает вызовы через new Function: 'unsafe-eval' получает
# только скрипт geometry-воркера, у воркера своя CSP из заголовка ответа.
map $uri $csp {
    ~^/assets/[^/]+\.worker-[^/]+\.js$ "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self' blob: data:";
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80 default_server;
    server_name _;

    # ACME и health отвечают по http всегда, остальное после выпуска
    # сертификата уходит на https (redirect/*.conf пишет enable-https.sh).
    include /etc/nginx/redirect/*.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/app.conf;
}

# HTTPS-сервер появляется только после выпуска сертификата: иначе nginx
# не стартует, ссылаясь на несуществующий файл ключа.
include /etc/nginx/ssl-vhost/*.conf;
